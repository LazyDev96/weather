# Xcode-проект генерируется XcodeGen: `brew install xcodegen && cd iosApp && xcodegen generate`
name: iosApp
options:
  bundleIdPrefix: com.example.weather
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.example.weather.ios
    PRODUCT_NAME: Weather
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Gradle запускается из скрипта сборки и пишет в папку проекта, песочница скриптов ему мешает
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Сюда :shared:embedAndSignAppleFrameworkForXcode кладёт Shared.framework
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework Shared"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Weather
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Нужно Compose Multiplatform для 120 Гц на iPhone
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # Xcode не видит JAVA_HOME из терминала и Android Studio, поэтому ищем JDK 17 сами
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME="$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home 2>/dev/null)"
          fi
          # Порядок поиска: gradlew проекта, gradle из PATH, Gradle, который скачала Android Studio
          if [ -x ./gradlew ]; then
            GRADLE=./gradlew
          elif command -v gradle >/dev/null 2>&1; then
            GRADLE="$(command -v gradle)"
          else
            GRADLE="$(ls -d "$HOME"/.gradle/wrapper/dists/gradle-*/*/gradle-*/bin/gradle 2>/dev/null | sort | tail -n 1)"
          fi
          if [ -z "$GRADLE" ]; then
            echo "error: не найден Gradle. Выполните в корне проекта 'gradle wrapper --gradle-version 8.10.2' или откройте проект в Android Studio." >&2
            exit 1
          fi
          "$GRADLE" :shared:embedAndSignAppleFrameworkForXcode
